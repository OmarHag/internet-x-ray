[package]
name = "internet-x-ray"
version = "0.1.0"
description = "Local-first network observability"
authors = ["Internet X-Ray contributors"]
edition = "2021"

[lib]
name = "internet_x_ray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
network-interface = "2"
hostname = "0.4"
thiserror = "2"
